<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script language="JavaScript">
        function tekan(){
            var jurasanstr = (document.fform.jurusan.value);
            document.fform.ojurusan.value = jurasanstr;
        }
        </script>
    <form name="fform">
        <h1>Pengguna Objek Select</h1>
        <hr>
        <h3>Masukan: </h3>
         Jurusan di SMK IGASAR PINDAD: <select name="jurusan" Size="1">
            <option value="Teknik Pemesinan" > TP </option>
            <option value="Teknik Sepeda Motor"> TSM </option>
            <option value="Teknik Kendaraan Ringan "> TKR </option>
            <option value="Teknik Jaringan Komputer Telekomunikasi"> TJKT </option>
            <option value="Pengembangan Perangkat Lunak Dan GIM"> PPLG </option>
         </select>
         <p><input type="button" value="kirim" onclick="tekan()">
            <input type="reset" value="ulang">
            <H3>Output Jurusan : </H3>
            <input type="text" name="ojurusan" size="40" >

    </form>

</body>
</html>
