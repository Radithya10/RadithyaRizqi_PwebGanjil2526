<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center">Formulir Pendaftaran Siswa </h1>
    <form>
      <table border="1" align="center">
        <tr>
            <td><label for = "ncs">Nama Calon Siswa</label></td>
            <td>:</td>
    <td>  <input type = "text" id = "ncs" name = "ncs"></td>
        </tr>
        <tr>
          <td>Tempat Tanggal Lahir</td>
          <td>:</td>
          <td> <input type = "text" id="ttl" name = "ttl"> 
            <input type = "date" id = "date" name = "date"></td>
        </tr>
        <tr>
           <td>Agama</td>
           <td>:</td>
              <td> <select name = "agama">
                <option value = "Islam">Islam</option>
                <option value = "Kristen">Kristen</option>
                <option value = "Hindu">Hindu</option>
                <option value = "Budha">Budha</option>
                <option value = "Konghucu">Konghucu</option></td>
              </tr>

        <tr>
            <td>Alamat</td>
            <td>:</td>
            <td><textarea name="alamat" id="alamat" rows="4" cols="40"></textarea></td>
            </tr>
        <tr>
            <td>No Telp Hp</td>
            <td>:</td>
            <td><input type="number" id="notelp" name="notelp"></td>
        </tr>

        <tr>
             <td>Jenis Kelamin</td>
             <td>:</td>
             <td> <input type="radio" name="jk" value="Laki-laki">Laki-laki
                  <input type="radio" name="jk" value="Perempuan">Perempuan</td>
        </tr>

        <tr>
            <td>Hobi</td>
            <td>:</td>
            <td> 
                <input type="checkbox" name="hobi" value="Olahraga">Olahraga
                <input type="checkbox" name="hobi" value="Membaca">Membaca
                <input type="checkbox" name="hobi" value="Menulis">Menulis
            </td>
        </tr>

        <tr>
            <td>Pas Foto</td>
            <td>:</td>      
            <td><input type="file" id="Pas Foto" name="Pas Foto"></td>
        </tr>

        <tr>
            <td>Username</td>
            <td>:</td>
            <td><input type="text" id="username" name="username"></td>

        </tr>

        <tr>
            <td>Password</td>
            <td>:</td>
            <td><input type="password" id="password" name="password"></td>
        </tr>
        <tr>
            <td colspan="3" align ="right"><input type="submit" name="submit" value="Submit">
                <input type="reset" name="cancel" value="Cancel"></td>



      </table>







    </form>

    
</body>
</html>
